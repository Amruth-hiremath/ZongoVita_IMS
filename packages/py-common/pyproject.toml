[project]
name = "ims-common"
version = "0.1.0"
description = "ZongoVita IMS shared runtime helpers: ids, secrets store, object store, tokens, problem details, logging"
requires-python = ">=3.13"
dependencies = [
    "ims-contracts",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ims_common"]
