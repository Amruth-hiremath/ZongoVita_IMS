[project]
name = "ims-contracts"
version = "0.1.0"
description = "ZongoVita IMS shared contracts: problem details, licence snapshot, event envelope, enums"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ims_contracts"]
