[project]
name = "ims-core"
version = "0.1.0"
description = "ZongoVita IMS Core: API server and worker (one codebase, two images; LD-04)"
requires-python = ">=3.13"
dependencies = [
    "ims-contracts",
    "ims-common",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ims_core"]
