;; Local pooler configuration. Values follow LLD 6.5 / 16 (AD-80):
;;   transaction mode; per customer database 3 server connections (maximum 4);
;;   idle server connections closed after 60 s; clients queued at most 5 s (-> 503 DB_BUSY).

[databases]
;; Lookup database for auth_query.
postgres = host=postgres port=5432 dbname=postgres pool_size=2 max_db_connections=2
;; Control-Plane database: budget of 20 connections for the Platform Service.
ims_control_plane = host=postgres port=5432 dbname=ims_control_plane pool_size=10 max_db_connections=20
;; Every customer database. A new customer needs no pooler change.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

pool_mode = transaction
default_pool_size = 3
max_db_connections = 4
server_idle_timeout = 60
max_client_conn = 5000
query_wait_timeout = 5

;; Backstops for the per-customer role defaults (LD-08: statement_timeout 15 s,
;; idle_in_transaction_session_timeout 30 s). PostgreSQL lets a role override its own
;; user-level settings, so the same limits are also held here, where no customer role can
;; change them. Set slightly above the role defaults so the database's own error comes first.
query_timeout = 20
idle_transaction_timeout = 35

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

;; Protocol-level prepared statements are not relied on (LD-75); the driver cache is disabled.
max_prepared_statements = 0

ignore_startup_parameters = extra_float_digits
server_tls_sslmode = disable
client_tls_sslmode = disable

logfile =
pidfile =
admin_users = pgbouncer_auth
